; PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stick-c-plus2

; 実機: M5StickC Plus2 (ESP32-PICO-V3-02, Flash 8MB / PSRAM 2MB)
; ボード定義は boards/m5stick-c-plus2.json（PlatformIO 標準に未収録のため同梱）
[env:m5stick-c-plus2]
platform = espressif32@6.10.0
board = m5stick-c-plus2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Unified@^0.2.2
test_ignore = *

; ホスト上でのユニットテスト（実機不要。ADR-0001 ①）
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
